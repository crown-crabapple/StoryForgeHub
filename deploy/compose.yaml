# StoryForge with Docker Compose (M08-J01). From the deploy/ folder:
#   cp storyforge.env.example storyforge.env      then edit storyforge.env (the owner name and the public address)
#   mkdir -p library config shared-data && sudo chown -R 10001:10001 library config shared-data     (the container runs as uid 10001)
#   docker compose up -d --build
#   docker compose logs storyforge                 the one-time setup link is printed here on the first start
# The app listens on 127.0.0.1:4317 of this machine only. Put a TLS reverse proxy in front for anyone else (see the commented caddy service and docs/self-hosting.md).
# By default there is no database service: the library is the Markdown folder, and the index is a disposable SQLite cache inside each book's .storyforge/ folder, rebuilt by the app
# when its format changes. For PostgreSQL as the canonical copy (docs/database.md) there is a commented-out postgres service below.
name: storyforge

services:
  storyforge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: storyforge:local
    init: true
    restart: unless-stopped
    env_file:
      - storyforge.env
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./library:/library
      - ./config:/config
      - ./shared-data:/shared-data

  # Optional: TLS with automatic certificates. To use it, remove the ports: block above (Caddy reaches the app over the compose network),
  # copy Caddyfile.example to Caddyfile, put your domain in it, and remove the # signs below. Ports 80 and 443 must reach this machine.
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   depends_on:
  #     - storyforge
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #
  # Optional: PostgreSQL as the canonical copy of the writing (docs/database.md). To use it, remove the # signs on the postgres service and its volume below, and add to
  # storyforge.env (the same password in both places; the library folder must be empty the first time, then import with db import, see docs/database.md):
  #   POSTGRES_PASSWORD=CHANGE_ME
  #   STORYFORGE_DATABASE=postgres://storyforge:CHANGE_ME@postgres:5432/storyforge
  # postgres:
  #   image: postgres:16
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: storyforge
  #     POSTGRES_DB: storyforge
  #   env_file:
  #     - storyforge.env
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
